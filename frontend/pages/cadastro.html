<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="../assets/Ellipse 4.webp">

    <title>Criar conta | MusicRate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="../index.html" class="auth-logo">
            MusicRate<span>.</span>
        </a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-label">JUNTE-SE A NÓS</span>
                <h1>Crie sua conta</h1>
                <p>Comece a avaliar e descobrir novas músicas.</p>
            </div>

            <form id="signup-form">

                <div class="auth-field">
                    <label for="username">Nome de usuário</label>

                    <div class="auth-input">
                        <i class="bi bi-at"></i>
                        <input type="text" id="username" placeholder="Escolha um nome de usuário" maxlength="30"
                            required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="full-name">Nome completo</label>

                    <div class="auth-input">
                        <i class="bi bi-person"></i>
                        <input type="text" id="full-name" placeholder="Digite seu nome completo" maxlength="100"
                            required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="signup-email">E-mail</label>

                    <div class="auth-input">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="signup-email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="signup-password">Senha</label>

                    <div class="auth-input">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="signup-password" placeholder="Crie uma senha" minlength="6" required>
                    </div>
                </div>

                <div id="signup-turnstile" class="turnstile-container"></div>

                <button type="submit" class="auth-button">
                    Criar minha conta
                    <i class="bi bi-arrow-right"></i>
                </button>

                <p id="signup-message" class="auth-message"></p>

            </form>

            <div class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </div>

        </section>

        <a href="../index.html" class="auth-back">
            <i class="bi bi-arrow-left"></i>
            Voltar para o início
        </a>

    </main>

    <script type="module" src="../js/auth.js"></script>

</body>

</html>
