<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="../assets/Ellipse 4.webp">

    <title>Entrar | MusicRate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="../index.html" class="auth-logo">
            MusicRate<span>.</span>
        </a>

        <div class="auth-card">

            <div class="auth-heading">
                <span class="auth-label">BEM-VINDO DE VOLTA</span>

                <h1>Entre na sua conta</h1>

                <p>Continue descobrindo e avaliando músicas.</p>
            </div>

            <form id="login-form">

                <div class="auth-field">
                    <label for="login-email">E-mail</label>

                    <div class="auth-input">
                        <i class="bi bi-envelope"></i>

                        <input type="email" id="login-email" placeholder="Digite seu e-mail" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="login-password">Senha</label>

                    <div class="auth-input">
                        <i class="bi bi-lock"></i>

                        <input type="password" id="login-password" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <div id="login-turnstile" class="turnstile-container"></div>

                <button type="submit" class="auth-button">
                    Entrar na conta
                    <i class="bi bi-arrow-right"></i>
                </button>

                <p id="login-message" class="auth-message"></p>

            </form>

            <div class="auth-footer">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </div>

        </div>

        <a href="../index.html" class="auth-back">
            <i class="bi bi-arrow-left"></i>
            Voltar para o início
        </a>

    </main>

    <script type="module" src="../js/auth.js"></script>

</body>

</html>
